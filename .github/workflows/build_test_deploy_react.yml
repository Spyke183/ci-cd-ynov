name: Build, Test and Deploy React Application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm ci, test, generate docs and build
        run: |
          npm ci
          npm test
          npm run jsdoc
          REACT_APP_API_URL=https://ci-cd-ynov-back-two.vercel.app npm run build --if-present
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Authenticate with npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - name: Build and publish package on NPM
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view @spyke183/ci-cd-ynov version 2>/dev/null || echo "0.0.0")
          echo "Local version: $LOCAL_VERSION"
          echo "NPM version: $NPM_VERSION"
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "Versions differ, publishing $LOCAL_VERSION..."
            npm run build-npm
            npm publish --access public
          else
            echo "Versions identical ($LOCAL_VERSION), skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build_test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
      - name: Build and start the stack
        run: docker compose -p ci-cd-ynov up -d --build
      - name: List containers
        run: docker ps
      - name: Wait for all services to be healthy
        run: |
          containers="ci-cd-ynov-db-1 ci-cd-ynov-adminer-1 ci-cd-ynov-api-1 ci-cd-ynov-react-1"
          for attempt in $(seq 1 40); do
            all_healthy=true
            for c in $containers; do
              status=$(docker inspect --format "{{json .State.Health.Status}}" "$c" 2>/dev/null || echo '"missing"')
              healthy=$(echo "$status" | jq '. == "healthy"')
              echo "$c -> $status"
              if [ "$healthy" != "true" ]; then all_healthy=false; fi
            done
            if [ "$all_healthy" = "true" ]; then
              echo "All 4 services are healthy!"
              exit 0
            fi
            echo "Attempt $attempt: waiting 10s..."
            sleep 10
          done
          echo "Timeout: some services never became healthy"
          docker compose -p ci-cd-ynov logs
          exit 1
      - name: Stop the stack
        if: always()
        run: docker compose -p ci-cd-ynov down

  build-docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-ynov-frontend -f DockerfileReact .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-ynov-frontend
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-ynov-backend -f server/Dockerfile ./server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-ynov-backend

  e2e-cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'

  deploy-vercel:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (requis par @vercel/python)
        uses: astral-sh/setup-uv@v5
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
